; Probes -- measuring instruments for asset and photometry work, added to the
; program so the Assistant's call can reach the members they declare. Python in the
; private assets build tree drives them. Each script's class doc says what it
; measures and why it is here.
;
; Kept separate from ivoyager_override.cfg because a driver may rewrite this file
; to add or remove one for the length of one run, then put it back -- which is
; what addons/tools/capture_body_icons.py does with body_2d_icon_capture.gd.

[core_initializer]

program_refcounteds/ExposureProbe="res://planetarium/exposure_probe.gd"
program_refcounteds/DialogRigProbe="res://planetarium/dialog_rig_probe.gd"
