; Planetarium overrides
;
; We replace the default IVUnits singleton and add preinitializer.gd, which
; does all further plugin changes.

[units_autoload]

IVUnits="res://planetarium/units.gd"

[core_initializer]

preinitializers/PlanetariumPreinitializer="res://planetarium/preinitializer.gd"

[assistant_server]

context_file="res://planetarium/assistant_context.txt"

[assistant]

enabled=true
assistant_name="Galileo"
instructions_file="res://planetarium/galileo_instructions.txt"
small_model_tool_set="compact"
large_model_tool_set="full"

[assistant_tool_sets]

; For a small model: a short list of tools, each with its own arguments.
compact=["BodyFinder.find_bodies", "SelectionManager.select_by_name", "ViewManager.set_table_view", "ViewManager.get_view_description", "IVSelectionData.get_body_data", "Timekeeper.set_time_from_date_clock_elements", "Timekeeper.set_operating_system_time_sync", "SpeedManager.increment_speed", "SpeedManager.decrement_speed", "IVStateManager.set_user_paused", "BodyHUDsState.set_huds_hidden", "BodyHUDsState.set_orbit_visibility", "BodyHUDsState.set_name_visibility", "IVShowHideUI.show_hide_gui", "IVCamera.set_focal_length", "WikiManager.open_page", "ExternalLinks.get_link_names", "ExternalLinks.open_link"]
; For a large model: the compact tools, and the generic ones for the rest.
full=["BodyFinder.find_bodies", "SelectionManager.select_by_name", "ViewManager.set_table_view", "ViewManager.get_view_description", "IVSelectionData.get_body_data", "Timekeeper.set_time_from_date_clock_elements", "Timekeeper.set_operating_system_time_sync", "SpeedManager.increment_speed", "SpeedManager.decrement_speed", "IVStateManager.set_user_paused", "BodyHUDsState.set_huds_hidden", "BodyHUDsState.set_orbit_visibility", "BodyHUDsState.set_name_visibility", "IVShowHideUI.show_hide_gui", "IVCamera.set_focal_length", "WikiManager.open_page", "ExternalLinks.get_link_names", "ExternalLinks.open_link", "describe", "get", "call", "list_widgets", "operate_widget", "list_actions", "press_action"]
